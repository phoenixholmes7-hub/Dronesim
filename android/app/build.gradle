plugins {
    id 'com.android.application'
}

// The web game lives at the repository root; copy it into the APK's assets at build time.
def webRoot = rootProject.projectDir.parentFile
def webAssets = layout.buildDirectory.dir('webassets')
tasks.register('syncWebAssets', Sync) {
    from(webRoot) {
        include 'index.html', 'style.css', 'js/**', 'icons/**', 'manifest.webmanifest'
    }
    into webAssets
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.steppehawk.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.steppehawk.game'
        minSdk 24
        targetSdk 35
        versionCode runNumber
        versionName "1.1.${runNumber}"
    }

    signingConfigs {
        // Public sideload key (like Android's debug key): keeps updates installable over each other.
        // Use your own private key from GitHub secrets before publishing on Google Play.
        sideload {
            storeFile file('steppehawk-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    sourceSets {
        main.assets.srcDir webAssets
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.named('preBuild') { dependsOn 'syncWebAssets' }

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.window:window-java:1.3.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
