name: Android APK

on:
  push:
    paths:
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'icons/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle -p android assembleRelease --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SteppeHawk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SteppeHawk-apk
          path: SteppeHawk.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Steppe Hawk ${{ github.run_number }} (Android)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SteppeHawk.apk
          body: |
            Android build of Steppe Hawk from commit ${{ github.sha }}.

            Install: download **SteppeHawk.apk** on your phone, open it, and allow installs from your browser or file manager when Android asks.
            Updates install over earlier builds.
